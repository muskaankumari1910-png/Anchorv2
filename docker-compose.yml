services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: anchor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anchor_user
      POSTGRES_PASSWORD: anchor_secure_pass_2024
      POSTGRES_DB: anchor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor_user -d anchor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anchor-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://anchor_user:anchor_secure_pass_2024@postgres:5432/anchor_db
      GROQ_API_KEY: ${GROQ_API_KEY}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anchor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"
    # Note: the built frontend calls the API via the relative path "/api",
    # which its own nginx (and the reverse-proxy nginx) forwards to the backend.
    # No build-time API URL is needed.

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: anchor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local
